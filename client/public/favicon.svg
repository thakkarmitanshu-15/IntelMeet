<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Purple to Pink Gradient -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Subtle Drop Shadow/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#c026d3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Square Background -->
  <rect x="15" y="15" width="70" height="70" rx="24" fill="url(#logoGrad)" filter="url(#glow)" />
  
  <!-- Centered White 'I' -->
  <rect x="45" y="34" width="10" height="32" fill="#ffffff" />
</svg>